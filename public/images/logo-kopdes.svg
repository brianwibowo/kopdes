<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64" fill="none">
  <!-- Brandmark Emblem (48x48) -->
  <g transform="translate(4, 8)">
    <defs>
      <linearGradient id="kdmpRed" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#b91c1c" />
        <stop offset="100%" stop-color="#7f1d1d" />
      </linearGradient>
      <linearGradient id="kdmpGold" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#f59e0b" />
        <stop offset="100%" stop-color="#b45309" />
      </linearGradient>
      <filter id="kdmpShadow" x="-15%" y="-15%" width="130%" height="130%" filterUnits="userSpaceOnUse">
        <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.12" />
      </filter>
    </defs>

    <!-- Outer Rounded Crest -->
    <rect x="1" y="1" width="46" height="46" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#kdmpShadow)" />

    <!-- Red Flag Wave (Upper) -->
    <path d="M 6 22 C 6 13 13 7 24 7 C 35 7 42 13 42 22 C 35 19.5 29 23.5 24 20 C 19 16.5 13 20 6 22 Z" fill="url(#kdmpRed)" />

    <!-- White Base Wave (Lower) -->
    <path d="M 6 24 C 12 21.5 18 25 24 22 C 30 19 36 21.5 42 24 C 42 33 35 41 24 41 C 13 41 6 33 6 24 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />

    <!-- Golden Sprout of Rural Growth (Padi Mandiri) -->
    <path d="M 24 13 C 24 13 28 18 28 22.5 C 28 25 26.2 27 24 27.8 C 21.8 27 20 25 20 22.5 C 20 18 24 13 24 13 Z" fill="url(#kdmpGold)" />
    <circle cx="24" cy="32.5" r="2.2" fill="url(#kdmpGold)" />
  </g>

  <!-- Typography -->
  <g transform="translate(62, 14)">
    <text x="0" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="22" fill="#0f172a" letter-spacing="-0.03em">
      KOPDES
    </text>
    <text x="96" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="22" fill="#991b1b" letter-spacing="-0.02em">
      MERAH PUTIH
    </text>
    <text x="1" y="35" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="8.5" fill="#64748b" letter-spacing="0.16em">
      KOPERASI DESA REPUBLIK INDONESIA
    </text>
  </g>
</svg>
